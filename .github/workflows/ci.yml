name: ci

# Same operator path as README "Key steps":
#   setup_all.sh → run_tests.sh → run_eval.sh validation
# Datasets ship in-tree at ./datasets (DATASETS_PATH).

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (README)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cp -n .env.example .env || cp .env.example .env

      - name: Verify in-tree datasets
        run: |
          set -euo pipefail
          test -f datasets/development_tickets.json
          test -f datasets/validation_tickets.json
          test -f datasets/documentation.json
          # Ensure .env points at the in-tree folder
          if grep -q '^DATASETS_PATH=' .env; then
            sed -i.bak 's|^DATASETS_PATH=.*|DATASETS_PATH=./datasets|' .env
          else
            echo 'DATASETS_PATH=./datasets' >> .env
          fi
          echo "DATASETS_PATH=./datasets"

      - name: Setup (./scripts/setup_all.sh)
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup_all.sh

      - name: Status (./scripts/status.sh)
        run: ./scripts/status.sh

      - name: Tests (./scripts/run_tests.sh)
        run: ./scripts/run_tests.sh

      - name: Eval validation (./scripts/run_eval.sh validation)
        run: ./scripts/run_eval.sh validation

      - name: Upload eval metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-eval-results
          path: |
            evaluation/results/**/metrics.json
            evaluation/results/**/metrics.md
            evaluation/results/**/run_summary.json
          if-no-files-found: warn
