global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cloudserve-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: cloudserve-api

  - job_name: cloudserve-eval
    metrics_path: /metrics
    static_configs:
      - targets: ["eval-exporter:9101"]
        labels:
          service: cloudserve-eval
